<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Suhu &amp; Udara — Shafa Sekar Chandrayani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style_dht22.css">
</head>
<body>

<div class="page">
  <header>
    <p class="eyebrow">monitoring udara punya</p>
    <p class="brand">Shafa Sekar Chandrayani 🌸</p>
    <h1>Suhu &amp; Kelembapan Udara</h1>
    <p class="sub">dipantau langsung dari sensor DHT22~</p>
  </header>

  <div class="status-banner" id="bubble">memuat hasil...</div>

  <div class="cards">
    <div class="card temp">
      <p class="label">Suhu</p>
      <p class="value"><span id="tempValue">--</span><span class="unit">°C</span></p>
      <p class="note" id="tempNote">menunggu data</p>
    </div>
    <div class="card humid">
      <p class="label">Kelembapan Udara</p>
      <p class="value"><span id="humValue">--</span><span class="unit">%</span></p>
      <p class="note" id="humNote">menunggu data</p>
    </div>
  </div>

  <div class="output">
    <span>Kipas Angin</span>
    <span class="badge" id="fanStatus">--</span>
  </div>

  <footer>dibuat oleh <strong>Shafa Sekar Chandrayani</strong> · project DHT22</footer>
</div>

<script src="script_dht22.js"></script>
</body>
</html>
