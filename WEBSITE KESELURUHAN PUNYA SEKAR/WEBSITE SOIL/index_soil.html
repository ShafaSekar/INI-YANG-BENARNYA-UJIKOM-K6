<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Kelembapan Tanah — Shafa Sekar Chandrayani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style_soil.css">
</head>
<body>

<div class="page">
  <header>
    <p class="eyebrow">monitoring tanah punya</p>
    <p class="brand">Shafa Sekar Chandrayani 🌱</p>
    <h1>Kelembapan Tanah</h1>
    <p class="sub">dipantau langsung dari soil moisture sensor~</p>
  </header>

  <div class="status-banner" id="bubble">memuat hasil...</div>

  <div class="card">
    <p class="label">Kelembapan Tanah</p>
    <p class="value"><span id="soilValue">--</span><span class="unit">%</span></p>
    <div class="bar"><div class="fill" id="soilFill"></div></div>
    <p class="note" id="soilNote">menunggu data</p>
  </div>

  <div class="output">
    <span>Pompa Air</span>
    <span class="badge" id="pumpStatus">--</span>
  </div>

  <footer>dibuat oleh <strong>Shafa Sekar Chandrayani</strong> · project Soil Moisture</footer>
</div>

<script src="script_soil.js"></script>
</body>
</html>
